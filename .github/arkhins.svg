<svg xmlns="http://www.w3.org/2000/svg" width="218" height="58" viewBox="0 0 218 58" role="img" aria-label="Arkhins">
  <defs>
    <style>
      @font-face { font-family: "Arkhins Script"; src: url(data:font/ttf;base64,) format("truetype"); }
    </style>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0">
        <animate attributeName="stop-color" values="#ff2d6f;#00f0ff;#c6ff3d;#a855f7;#ff2d6f" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5">
        <animate attributeName="stop-color" values="#00f0ff;#c6ff3d;#a855f7;#ff2d6f;#00f0ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1">
        <animate attributeName="stop-color" values="#c6ff3d;#a855f7;#ff2d6f;#00f0ff;#c6ff3d" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <text x="2" y="46" font-family="'Arkhins Script', Allura, cursive" font-size="72" fill="url(#g)">Arkhins</text>
</svg>
