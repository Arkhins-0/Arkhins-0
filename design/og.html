<!doctype html>
<!--
  Source for public/images/og.png (1200×630 share image).
  Open in a browser at exactly 1200×630 and screenshot, or render with Playwright.
  Paths point into ../public so it uses the same art as the site.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OG image</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800;900&display=block" rel="stylesheet" />
<style>
  :root {
    --paper: #fff7ea; --ink: #1c1633; --ink2: #4a4368; --sakura: #ff4f8b; --sakura-soft: #ffd3e2;
    --sky: #2f8cff; --sun: #ffcc29; --mint: #1fcf9a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: 'M PLUS Rounded 1c', system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(120% 80% at 75% 0%, #fff 0%, transparent 55%),
      linear-gradient(180deg, #6fc3ff 0%, #a9dcff 45%, #ffe3ef 82%, var(--paper) 100%);
  }
  .display { font-family: 'Dela Gothic One', sans-serif; font-weight: 400; }

  .burst {
    position: absolute; left: 520px; top: -420px; width: 1400px; height: 1400px;
    background: repeating-conic-gradient(from 0deg, rgb(255 255 255 / .32) 0deg 6deg, transparent 6deg 16deg);
    -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 60%);
  }
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgb(28 22 51 / .10) 1.3px, transparent 1.6px);
    background-size: 12px 12px;
    -webkit-mask-image: linear-gradient(90deg, #000 0%, transparent 45%);
  }
  .cloud { position: absolute; background: #fff; border-radius: 999px; filter: drop-shadow(0 5px 0 rgb(47 140 255 / .15)); }
  .cloud::before, .cloud::after { content: ''; position: absolute; background: #fff; border-radius: 999px; }
  .cloud::before { width: 55%; height: 170%; left: 14%; bottom: 20%; }
  .cloud::after { width: 40%; height: 130%; right: 12%; bottom: 25%; }
  .petal {
    position: absolute; width: 16px; height: 13px; border-radius: 100% 0 100% 0;
    background: linear-gradient(135deg, #ffd6e6, #ff8db6); opacity: .9;
  }

  /* left column */
  .left { position: absolute; left: 64px; top: 58px; width: 640px; z-index: 5; }
  .tags { display: flex; gap: 12px; align-items: center; }
  .episode { display: inline-flex; border: 3px solid var(--ink); border-radius: 10px; overflow: hidden; box-shadow: 3px 3px 0 var(--ink); background: #fff; font-weight: 900; font-size: 17px; letter-spacing: .05em; }
  .episode span { padding: 6px 13px; }
  .episode span:first-child { background: var(--ink); color: #fff; }
  .chip { display: inline-flex; align-items: center; gap: 8px; border: 3px solid var(--ink); border-radius: 999px; background: #fff; padding: 5px 15px; font-weight: 900; font-size: 16px; }
  .chip i { width: 10px; height: 10px; border-radius: 99px; background: var(--mint); display: block; }

  h1 { margin-top: 26px; line-height: .9; position: relative; }
  .first {
    display: block; font-size: 148px; color: #fff;
    -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; text-shadow: 8px 8px 0 var(--ink);
    letter-spacing: .01em;
  }
  .last {
    display: block; margin-top: 10px; font-size: 64px; color: var(--sakura);
    -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 4px 4px 0 var(--ink);
  }
  .kana {
    position: absolute; left: -46px; top: 8px; writing-mode: vertical-rl; text-orientation: upright;
    font-size: 30px; color: var(--sakura); letter-spacing: .08em;
  }

  .bubble {
    position: relative; display: inline-block; margin-top: 30px; background: #fff;
    border: 3px solid var(--ink); border-radius: 22px; padding: 12px 22px; box-shadow: 4px 4px 0 var(--ink);
  }
  .bubble::before { content: ''; position: absolute; left: 30px; bottom: -21px; border-style: solid; border-width: 21px 19px 0 0; border-color: var(--ink) transparent transparent; }
  .bubble::after { content: ''; position: absolute; left: 33px; bottom: -14px; border-style: solid; border-width: 15px 13px 0 0; border-color: #fff transparent transparent; }
  .bubble small { display: block; font-weight: 800; font-size: 15px; color: var(--ink2); }
  .bubble b { display: block; font-family: 'Dela Gothic One'; font-weight: 400; font-size: 27px; }
  .bubble b em { font-style: normal; color: var(--sakura); }

  .domain { position: absolute; left: 64px; bottom: 96px; z-index: 6; display: flex; gap: 12px; }
  .domain .chip { font-size: 18px; box-shadow: 3px 3px 0 var(--ink); }
  .domain .chip.pink { background: var(--sakura); color: #fff; }

  /* character */
  .stage { position: absolute; right: 26px; top: 26px; width: 470px; height: 604px; z-index: 4; }
  .halo {
    position: absolute; left: 50%; top: 70px; width: 420px; height: 420px; transform: translateX(-50%);
    border-radius: 999px; border: 4px solid var(--ink); background: var(--sun); box-shadow: 8px 8px 0 var(--ink); overflow: hidden;
  }
  .halo::after { content: ''; position: absolute; inset: 0; background-image: radial-gradient(circle, rgb(255 79 139 / .45) 2px, transparent 2.6px); background-size: 14px 14px; }
  .hero-img {
    position: absolute; left: 50%; bottom: 0; height: 600px; transform: translateX(-50%);
    filter: drop-shadow(8px 10px 0 rgb(28 22 51 / .22));
  }
  .sticker {
    position: absolute; z-index: 6; border: 3px solid var(--ink); border-radius: 999px; padding: 6px 16px;
    font-weight: 900; font-size: 18px; box-shadow: 3px 3px 0 var(--ink);
  }
  .yoroshiku {
    position: absolute; right: 330px; top: 40px; z-index: 7; transform: rotate(-5deg);
    background: #fff; border: 3px solid var(--ink); border-radius: 18px; padding: 8px 16px; box-shadow: 3px 3px 0 var(--ink);
  }
  .yoroshiku b { display: block; font-family: 'Dela Gothic One'; font-weight: 400; font-size: 22px; line-height: 1.1; }
  .yoroshiku small { display: block; font-weight: 800; font-size: 13px; color: var(--sakura); }
  .yoroshiku::after { content: ''; position: absolute; right: 26px; bottom: -18px; border-style: solid; border-width: 18px 0 0 16px; border-color: var(--ink) transparent transparent; }

  /* ribbon */
  .ribbon {
    position: absolute; left: -40px; right: -40px; bottom: 26px; z-index: 8; transform: rotate(-2deg);
    background: var(--sun); border-block: 4px solid var(--ink); padding: 11px 0; white-space: nowrap; overflow: hidden;
  }
  .ribbon span { font-family: 'Dela Gothic One'; font-size: 24px; margin: 0 16px; }
  .ribbon span.s { color: var(--sakura); margin: 0 4px; }
</style>
</head>
<body>
  <div class="burst"></div>
  <div class="dots"></div>
  <span class="cloud" style="left:40px;top:560px;width:170px;height:40px;opacity:.0"></span>
  <span class="cloud" style="left:520px;top:34px;width:150px;height:36px"></span>
  <span class="cloud" style="left:720px;top:470px;width:120px;height:30px;opacity:.9"></span>

  <span class="petal" style="left:610px;top:120px;transform:rotate(20deg)"></span>
  <span class="petal" style="left:660px;top:330px;transform:rotate(-40deg) scale(.8)"></span>
  <span class="petal" style="left:560px;top:430px;transform:rotate(70deg) scale(1.1)"></span>
  <span class="petal" style="left:1150px;top:70px;transform:rotate(10deg) scale(.9)"></span>
  <span class="petal" style="left:1110px;top:470px;transform:rotate(-20deg)"></span>
  <span class="petal" style="left:420px;top:40px;transform:rotate(45deg) scale(.7)"></span>

  <div class="left">
    <div class="tags">
      <span class="episode"><span>EP.00 — PILOT</span><span>アーキンズ</span></span>
      <span class="chip"><i></i>Open to Opportunities</span>
    </div>
    <h1>
      <span class="kana display">クリシュナ</span>
      <span class="first display">Krishna</span>
      <span class="last display">Vijay G</span>
    </h1>
    <div class="bubble">
      <small>Designer · Developer · Chennai</small>
      <b>UI/UX <em>✦</em> Full-stack <em>✦</em> AI / ML</b>
    </div>
  </div>

  <div class="domain">
    <span class="chip pink">arkhins.com</span>
  </div>

  <div class="stage">
    <div class="halo"></div>
    <img class="hero-img" src="../public/images/anime/characters/zero-two/figure.webp" alt="" />
    <span class="sticker" style="right:-4px;top:120px;background:var(--sun);transform:rotate(6deg)">AI / ML</span>
    <span class="sticker" style="left:6px;top:400px;background:var(--mint);color:#fff;transform:rotate(3deg)">Web</span>
    <span class="sticker" style="right:0;top:430px;background:#fff;transform:rotate(-4deg)">Full-stack</span>
  </div>

  <div class="yoroshiku"><b>Yoroshiku!</b><small>よろしく！</small></div>

  <div class="ribbon">
    <span>DESIGN</span><span class="s">✦</span><span>デザイン</span><span class="s">✦</span><span>CODE</span><span class="s">✦</span><span>コード</span><span class="s">✦</span><span>AI</span><span class="s">✦</span><span>人工知能</span><span class="s">✦</span><span>SOFTWARE</span><span class="s">✦</span><span>ソフトウェア</span><span class="s">✦</span><span>DESIGN</span><span class="s">✦</span><span>デザイン</span>
  </div>
</body>
</html>
